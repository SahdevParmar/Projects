<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <main>
        <nav>
            <div class="left">
                <h2>Kanban</h2>
            </div>
            <div class="right">
                <button class="addNewBtn">Add New</button>
            </div>
        </nav>
        <section class="board">
            <div id="todo" class="task-column">
                <div class="heading">
                    <div class="left">To do</div>
                    <div class="right"></div>
                </div>
                <div class="task-list">
                </div>
            </div>
            <div id="progress" class="task-column">
                <div class="heading">
                    <div class="left">In progress</div>
                    <div class="right"></div>
                </div>

                <div class="task-list">
                </div>
            </div>
            <div id="done" class="task-column">
                <div class="heading">
                    <div class="left">Done</div>
                    <div class="right"></div>
                </div>

                <div class="task-list">

                </div>
            </div>
            </div>
        </section>
    </main>
    <div class="modal">
        <form class="bbb">
            <h2>Add new Task:</h2>
            <input type="text" placeholder="Task Name" id="taskName">
            <input type="text" placeholder="Details" id="taskDetails">
            <button class="submitNewTask">Add</button>
            <button class="delete-button"></button>
        </form>
    </div>

    <script src="script.js"></script>
</body>

</html>
