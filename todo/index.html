<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <main>
        <nav>
            <div class="left">Kanban</div>
            <div class="right">
                <button class="addNewButton">Add New Task</button>
            </div>
        </nav>
        <section class="board">
            <div id="todo" class="task-column">
                <div class="heading">
                    <div class="left">To Do</div>
                    <div class="right">Count</div>
                </div>
                <div class="task-list">
                    <div draggable="true" class="task">
                        <button class="delete-button"></button>
                        <h2 class="task-title">Task3</h2>
                        <p class="task-description">Description for task</p>

                    </div>
                </div>
            </div>
            <div id="progress" class="task-column">
                <div class="heading">
                    <div class="left">To Do</div>
                    <div class="right">Count</div>
                </div>

                <div class="task-list">
                    <div draggable="true" class="task">
                        <h2 class="task-title">Task4</h2>
                        <p class="task-description">Description for task</p>
                        <button class="delete-button"></button>
                    </div>
                </div>
            </div>
            <div class="task-column" id="done">
                <div class="heading">
                    <div class="left">To Do</div>
                    <div class="right">Count</div>
                </div>

                <div class="task-list">
                    <div draggable="true" class="task">
                        <h2 class="task-title">Task1</h2>
                        <p class="task-description">Description for task</p>
                        <button class="delete-button"></button>
                    </div>
                    <div draggable="true" class="task">
                        <h2 class="task-title">Task2</h2>
                        <p class="task-description">Description for task</p>
                        <button class="delete-button"></button>
                    </div>
                </div>
            </div>
        </section>
    </main>
    <div class="modal">
        <form action="">
            Add Task
            <input type="text" placeholder="taskName">
            <input type="text" placeholder="Details">
        </form>
    </div>

    <script src="script.js"></script>
</body>

</html>
